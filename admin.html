<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sello Admin</title>
<meta name="theme-color" content="#062E24">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="https://iili.io/CD6eob9.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sello-styles.css">
</head>
<body>
<div id="app"><div class="loading">Opening Sello Admin…</div></div>

<script type="module">
import { db, auth } from "./firebase-init.js";
import { collection, getDocs, addDoc, updateDoc, deleteDoc, doc, query, orderBy, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import { onAuthStateChanged, signInWithEmailAndPassword, signOut }
  from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

const CATEGORIES = ["Tailoring & Fashion","Hair & Beauty","Photography & Video","Catering & Events","Home & Repairs","Tech & Gadgets","Auto & Mechanic","Health & Wellness","Cleaning Services"];
const OTHER_VALUE = "__other__";
const MAX_LOGO_BYTES = 180000; // keeps documents well under Firestore's 1MB limit

let state = {
  user: null,
  authChecked: false,
  adminView: "list",   // list | add | edit
  editingId: null,
  providers: [],
  toast: null,
};

function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstChild; }
function esc(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }

async function loadProviders(){
  const snap = await getDocs(query(collection(db,'providers'), orderBy('createdAt','desc')));
  state.providers = snap.docs.map(d=>({ id:d.id, ...d.data() }));
}

// Resize + compress an uploaded image client-side so it fits safely inside
// a Firestore document (no Firebase Storage / billing plan required).
function resizeImageToDataUrl(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const maxDim = 300;
        let { width, height } = img;
        if(width > height){ if(width>maxDim){ height*=maxDim/width; width=maxDim; } }
        else { if(height>maxDim){ width*=maxDim/height; height=maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        let quality = 0.75;
        let dataUrl = canvas.toDataURL('image/jpeg', quality);
        while(dataUrl.length * 0.75 > MAX_LOGO_BYTES && quality > 0.3){
          quality -= 0.1;
          dataUrl = canvas.toDataURL('image/jpeg', quality);
        }
        resolve(dataUrl);
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  if(!state.authChecked){ app.appendChild(el(`<div class="loading">Opening Sello Admin…</div>`)); return; }
  app.appendChild(state.user ? renderDashboard() : renderLogin());
  if(state.toast){
    const t = el(`<div class="toast">${esc(state.toast)}</div>`);
    app.appendChild(t);
    setTimeout(()=>{ state.toast=null; t.remove(); }, 2200);
  }
}

function renderLogin(){
  const wrap = el(`<div class="admin-shell">
    <div class="admin-login">
      <div class="stamp">S</div>
      <h2>Sello Admin</h2>
      <p class="sub">Sign in to add and manage service providers.</p>
      <input class="field" id="loginEmail" placeholder="Email address" autocomplete="username">
      <input class="field" id="loginPass" type="password" placeholder="Password" autocomplete="current-password">
      <button class="btn-primary" id="loginBtn">Sign in</button>
      <div id="loginErr"></div>
      <div class="admin-hint">Admin users are created in the Firebase console under Authentication → Users — there's no public sign-up here.<br><br>
      <a href="index.html" style="color:rgba(255,255,255,0.7);text-decoration:underline;">← Back to the main site</a></div>
    </div>
  </div>`);

  const doLogin = async ()=>{
    const email = wrap.querySelector('#loginEmail').value.trim();
    const pass = wrap.querySelector('#loginPass').value;
    const errEl = wrap.querySelector('#loginErr');
    const btn = wrap.querySelector('#loginBtn');
    if(!email || !pass){ errEl.innerHTML = '<div class="err">Enter your email and password.</div>'; return; }
    btn.disabled = true; btn.textContent = 'Signing in…';
    try{
      await signInWithEmailAndPassword(auth, email, pass);
      // onAuthStateChanged picks up the rest
    }catch(err){
      errEl.innerHTML = '<div class="err">That email or password isn\'t right.</div>';
      btn.disabled = false; btn.textContent = 'Sign in';
    }
  };
  wrap.querySelector('#loginBtn').onclick = doLogin;
  wrap.querySelector('#loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
  return wrap;
}

function renderDashboard(){
  const wrap = el(`<div class="admin-shell">
    <div class="admin-top">
      <div class="brand"><div class="stamp" style="border-color:var(--emerald-tint);color:var(--emerald-tint);">S</div><h1 style="color:#fff;font-size:18px;">Sello Admin</h1></div>
      <button class="logout" id="logoutBtn">Log out</button>
    </div>
    <div class="admin-body">
      <div class="tab-row">
        <button class="tab ${state.adminView==='list'?'active':''}" id="tabList">Providers (${state.providers.length})</button>
        <button class="tab ${state.adminView==='add'?'active':''}" id="tabAdd">+ Add new</button>
      </div>
      <div id="adminContent"></div>
      <div style="margin-top:24px;"><a href="index.html" style="font-size:12px;color:var(--ink-soft);text-decoration:underline;">View the main site →</a></div>
    </div>
  </div>`);

  wrap.querySelector('#logoutBtn').onclick = async ()=>{ await signOut(auth); };
  wrap.querySelector('#tabList').onclick = ()=>{ state.adminView='list'; state.editingId=null; render(); };
  wrap.querySelector('#tabAdd').onclick = ()=>{ state.adminView='add'; state.editingId=null; render(); };

  const content = wrap.querySelector('#adminContent');
  if(state.adminView === 'list'){
    if(!state.providers.length){
      content.appendChild(el(`<div class="empty"><div class="stamp">?</div><p>No providers yet.<br>Add your first one.</p></div>`));
    } else {
      state.providers.forEach((p,i)=>{
        const row = el(`<div class="provider-row">
          <div class="provider-row-left">
            ${p.logo ? `<img class="provider-row-logo" src="${p.logo}" alt="">` : ''}
            <div><div class="mono" style="font-size:11px;color:var(--ink-soft);">N°${String(i+1).padStart(3,'0')}</div><div class="p-name">${esc(p.name)}</div><div class="p-niche">${esc(p.niche)}</div></div>
          </div>
          <div class="row-actions">
            <button class="btn-edit">Edit</button>
            <button class="btn-danger">Remove</button>
          </div>
        </div>`);
        row.querySelector('.btn-edit').onclick = ()=>{ state.adminView='edit'; state.editingId=p.id; render(); };
        row.querySelector('.btn-danger').onclick = async ()=>{
          if(!confirm(`Remove ${p.name} from Sello?`)) return;
          await deleteDoc(doc(db,'providers',p.id));
          await loadProviders();
          state.toast = "Removed from Sello";
          render();
        };
        content.appendChild(row);
      });
    }
  } else {
    content.appendChild(renderForm(state.adminView === 'edit' ? state.providers.find(p=>p.id===state.editingId) : null));
  }
  return wrap;
}

function renderForm(existing){
  const isEdit = !!existing;
  const knownCategory = existing && CATEGORIES.includes(existing.niche);
  const startsAsOther = existing && !knownCategory;
  let logoDataUrl = existing?.logo || null;

  const form = el(`<div>
    <label>Business / brand name</label>
    <input class="field" id="fName" placeholder="e.g. Adaeze Threads" value="${esc(existing?.name||'')}">

    <label>Category</label>
    <select class="field" id="fNiche">
      ${CATEGORIES.map(c=>`<option ${existing && c===existing.niche?'selected':''}>${esc(c)}</option>`).join('')}
      <option value="${OTHER_VALUE}" ${startsAsOther?'selected':''}>Other — type your own</option>
    </select>
    <input class="field" id="fNicheOther" placeholder="Type the category" style="display:${startsAsOther?'block':'none'};" value="${startsAsOther?esc(existing.niche):''}">

    <label>What they offer</label>
    <textarea class="field" id="fDesc" placeholder="A short, honest description of the brand and what customers get">${esc(existing?.desc||'')}</textarea>

    <label>Shop / contact address</label>
    <input class="field" id="fContact" placeholder="e.g. Shop 4, Adeniran Ogunsanya St, Lagos" value="${esc(existing?.contact||'')}">

    <label>WhatsApp number (with country code, no + or spaces)</label>
    <input class="field" id="fWhatsapp" placeholder="e.g. 2348012345678" value="${esc(existing?.whatsapp||'')}">

    <label>Brand logo (optional)</label>
    <div class="logo-upload">
      <img class="logo-preview" id="logoPreview" src="${logoDataUrl||''}" style="display:${logoDataUrl?'block':'none'};">
      <div class="logo-preview empty" id="logoEmpty" style="display:${logoDataUrl?'none':'flex'};">No logo</div>
      <label class="file-btn">Choose image<input type="file" accept="image/*" id="fLogo"></label>
    </div>

    <button class="btn-primary" id="saveBtn">${isEdit ? 'Save changes' : 'Add to Sello — goes live instantly'}</button>
    ${isEdit ? `<button class="btn-secondary" id="cancelBtn" style="margin-top:8px;">Cancel</button>` : ''}
    <div id="formMsg"></div>
  </div>`);

  const nicheSelect = form.querySelector('#fNiche');
  const nicheOther = form.querySelector('#fNicheOther');
  nicheSelect.onchange = ()=>{ nicheOther.style.display = nicheSelect.value===OTHER_VALUE ? 'block' : 'none'; };

  form.querySelector('#fLogo').onchange = async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const msgEl = form.querySelector('#formMsg');
    try{
      logoDataUrl = await resizeImageToDataUrl(file);
      form.querySelector('#logoPreview').src = logoDataUrl;
      form.querySelector('#logoPreview').style.display = 'block';
      form.querySelector('#logoEmpty').style.display = 'none';
    }catch(err){
      msgEl.innerHTML = '<div class="err">Couldn\'t read that image — try a different file.</div>';
    }
  };

  form.querySelector('#saveBtn').onclick = async (e)=>{
    const btn = e.currentTarget;
    const name = form.querySelector('#fName').value.trim();
    const niche = nicheSelect.value===OTHER_VALUE ? nicheOther.value.trim() : nicheSelect.value;
    const desc = form.querySelector('#fDesc').value.trim();
    const contact = form.querySelector('#fContact').value.trim();
    const whatsapp = form.querySelector('#fWhatsapp').value.trim().replace(/[^0-9]/g,'');
    const msgEl = form.querySelector('#formMsg');
    if(!name || !niche || !desc || !contact || !whatsapp){
      msgEl.innerHTML = '<div class="err">Fill in every field — including a valid WhatsApp number.</div>';
      return;
    }
    btn.disabled = true; btn.textContent = isEdit ? 'Saving…' : 'Adding…';
    const payload = { name, niche, desc, contact, whatsapp, logo: logoDataUrl || null };
    try{
      if(isEdit){
        await updateDoc(doc(db,'providers',existing.id), payload);
        state.toast = `${name} updated`;
      } else {
        await addDoc(collection(db,'providers'), { ...payload, createdAt: serverTimestamp() });
        state.toast = `${name} is live on Sello`;
      }
      await loadProviders();
      state.adminView = 'list';
      state.editingId = null;
      render();
    }catch(err){
      msgEl.innerHTML = '<div class="err">Couldn\'t save that — check your connection and try again.</div>';
      btn.disabled = false; btn.textContent = isEdit ? 'Save changes' : 'Add to Sello — goes live instantly';
    }
  };

  if(isEdit){
    form.querySelector('#cancelBtn').onclick = ()=>{ state.adminView='list'; state.editingId=null; render(); };
  }

  return form;
}

// ---------- init ----------
onAuthStateChanged(auth, async (user)=>{
  state.user = user;
  state.authChecked = true;
  if(user){
    try{ await loadProviders(); }catch(e){ console.error(e); }
  }
  render();
});
render();
</script>
</body>
</html>
